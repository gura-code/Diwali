<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandi Chhor Divas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Sfondo iniziale color crema molto leggero */
            background-color: #fcf8f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #5c4033;
            transition: background 1s ease;
        }

        /* Effetto luce che illumina lo sfondo quando la lampada è accesa */
        body.acceso {
            background: radial-gradient(circle, #fff3e6 0%, #edd3be 100%);
        }

        .container {
            text-align: center;
            cursor: pointer;
            padding: 20px;
            max-width: 350px;
            width: 100%;
        }

        .diya-card {
            background: #ffffff;
            border: 2px solid #e8d7cd;
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 10px 25px rgba(92, 64, 51, 0.05);
            transition: transform 0.3s ease, background 0.5s ease;
        }

        .diya-card:hover {
            transform: translateY(-5px);
        }

        .diya-media-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Immagine spenta */
        .diya-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Video fuoco - mix-blend-mode rende il nero trasparente */
        .diya-video {
            position: absolute;
            width: 150px;
            height: 150px;
            object-fit: contain;
            display: none;
            mix-blend-mode: screen; 
            pointer-events: none;
        }

        .initial-text h1 {
            font-size: 1.4rem;
            color: #8c6250;
            font-weight: 500;
        }

        .hidden-message {
            display: none;
            margin-top: 10px;
            animation: fadeIn 0.8s ease forwards;
        }

        .hidden-message h2 {
            font-size: 1.3rem;
            color: #8c6250;
            margin-bottom: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container" onclick="accendiLuce()">
        <div class="diya-card" id="card">
            
            <div class="diya-media-container">
                <img src="diya-off.png" alt="Diya" class="diya-img" id="imgSpenta">
                <video src="fuoco.mp4" class="diya-video" id="videoFuoco" autoplay loop muted playsinline></video>
            </div>

            <div class="initial-text" id="testoIniziale">
                <h1>ਬੰਦੀ ਛੋੜ ਦਿਵਸ</h1>
                <p>Tocca per accendere ✨</p>
            </div>

            <div class="hidden-message" id="messaggioNascosto">
                <h2>ਬੰਦੀ ਛੋੜ ਦਿਵਸ</h2>
                <p>Buon grandissimo Divas!</p>
            </div>

        </div>
    </div>

    <script>
        function accendiLuce() {
            const card = document.getElementById('card');
            const testoIniziale = document.getElementById('testoIniziale');
            const messaggioNascosto = document.getElementById('messaggioNascosto');
            const imgSpenta = document.getElementById('imgSpenta');
            const videoFuoco = document.getElementById('videoFuoco');

            if (!card.classList.contains('attivo')) {
                card.classList.add('attivo');
                document.body.classList.add('acceso');
                
                imgSpenta.style.display = 'none';
                videoFuoco.style.display = 'block';
                videoFuoco.play();

                testoIniziale.style.display = 'none';
                messaggioNascosto.style.display = 'block';
            }
        }
    </script>

</body>
</html>
