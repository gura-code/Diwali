<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandi Chhor Divas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fcf8f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #5c4033;
        }

        .container {
            text-align: center;
            cursor: pointer;
            padding: 20px;
            max-width: 350px;
            width: 100%;
        }

        .diya-card {
            background: #ffffff;
            border: 2px solid #e8d7cd;
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 10px 25px rgba(92, 64, 51, 0.05);
            transition: transform 0.3s ease;
        }

        .diya-card:hover {
            transform: translateY(-5px);
        }

        .diya-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        /* Testo iniziale */
        .initial-text h1 {
            font-size: 1.3rem;
            color: #8c6250;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .initial-text p {
            font-size: 0.85rem;
            color: #b08978;
        }

        /* Messaggio nascosto */
        .hidden-message {
            display: none;
            margin-top: 10px;
            animation: fadeIn 0.8s ease forwards;
        }

        .hidden-message h2 {
            font-size: 1.2rem;
            color: #8c6250;
            margin-bottom: 8px;
        }

        .hidden-message p {
            font-size: 0.9rem;
            color: #6e4e41;
            line-height: 1.4;
        }

        .signature {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #b08978;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container" onclick="apriAuguri()">
        <div class="diya-card" id="card">
            
            <div class="diya-icon">🪔</div>

            <!-- Testo iniziale in Punjabi -->
            <div class="initial-text" id="testoIniziale">
                <h1>ਬंदी ਛੋੜ ਦਿਵਸ ਮੁਬਾਰਕ</h1>
                <p>Tocca per aprire ✨</p>
            </div>

            <!-- Messaggio essenziale richiesto -->
            <div class="hidden-message" id="messaggioNascosto">
                <h2>ਬੰਦੀ ਛੋੜ ਦਿਵਸ</h2>
                <p>Buon grandissimo Divas!</p>
                <div class="signature">( ˘ ³˘)♥ ✧ ˚ 🪷</div>
            </div>

        </div>
    </div>

    <script>
        function apriAuguri() {
            const card = document.getElementById('card');
            const testoIniziale = document.getElementById('testoIniziale');
            const messaggioNascosto = document.getElementById('messaggioNascosto');

            if (!card.classList.contains('open')) {
                card.classList.add('open');
                testoIniziale.style.display = 'none';
                messaggioNascosto.style.display = 'block';
            }
        }
    </script>

</body>
</html>
