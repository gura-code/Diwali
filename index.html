<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandi Chhor Divas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0E0E0E; /* Il colore che hai scelto */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #ffffff;
            cursor: pointer;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }

        .media-box {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .diya-img, .diya-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .diya-video {
            display: none;
        }

        .initial-text h1 {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #f3f3f3;
            margin-bottom: 8px;
        }

        .initial-text p {
            font-size: 0.85rem;
            color: #888888;
        }

        .hidden-message {
            display: none;
            animation: fadeIn 0.8s ease forwards;
        }

        .hidden-message h2 {
            font-size: 1.5rem;
            font-weight: 400;
            color: #f3f3f3;
            margin-bottom: 8px;
        }

        .hidden-message p {
            font-size: 1rem;
            color: #cccccc;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container" onclick="accendiLuce()">
        
        <div class="media-box">
            <img src="diya-off.png" alt="Diya Spenta" class="diya-img" id="imgSpenta">
            <video src="fuoco.mp4" class="diya-video" id="videoFuoco" autoplay loop muted playsinline></video>
        </div>

        <div class="initial-text" id="testoIniziale">
            <h1>ਬੰਦੀ ਛੋੜ ਦਿਵਸ</h1>
            <p>Tocca per accendere</p>
        </div>

        <div class="hidden-message" id="messaggioNascosto">
            <h2>ਬੰਦੀ ਛੋੜ ਦਿਵਸ</h2>
            <p>Buon grandissimo Divas!</p>
        </div>

    </div>

    <script>
        function accendiLuce() {
            const testoIniziale = document.getElementById('testoIniziale');
            const messaggioNascosto = document.getElementById('messaggioNascosto');
            const imgSpenta = document.getElementById('imgSpenta');
            const videoFuoco = document.getElementById('videoFuoco');

            if (imgSpenta.style.display !== 'none') {
                imgSpenta.style.display = 'none';
                videoFuoco.style.display = 'block';
                videoFuoco.play();

                testoIniziale.style.display = 'none';
                messaggioNascosto.style.display = 'block';
            }
        }
    </script>

</body>
</html>
